:root{--bg:#071014;--panel:#0b1a20;--panel2:#10242a;--line:#24434a;--green:#9cffb0;--cyan:#55e6e6;--red:#ff666e;--amber:#f4ca72;--muted:#8aa0a2;--white:#e8f2ed;--mono:'Share Tech Mono',monospace;--head:'Barlow Condensed',Impact,sans-serif;--body:'DM Sans',Arial,sans-serif}

.progress-wrap{height:4px;background:#1a3035;margin:14px 0 25px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.file-card{border:1px solid var(--line);background:linear-gradient(135deg,#0e2026,#091419);padding:0;text-align:left;color:inherit;display:grid;grid-template-columns: minmax(120px, .8fr) 1.2fr;min-height:190px;transition:.2s;overflow:hidden;position:relative}.file-card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 10px 35px #0005}.file-card.locked{opacity:.5;filter:grayscale(.7);cursor:not-allowed}.thumb{background:#142a30;position:relative;min-height:190px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;filter:saturate(.75) contrast(1.08)}.thumb .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#477078;font:30px var(--mono);background:linear-gradient(145deg,#183239,#081419)}.card-copy{padding:18px 17px;display:flex;flex-direction:column;gap:7px}.file-no{font:10px var(--mono);color:var(--green);letter-spacing:.12em}.card-copy h3{font:700 25px/1 var(--head);letter-spacing:.04em;margin:0}.card-copy p{font-size:12px;line-height:1.55;color:#9fb2b0;margin:0}.card-meta{font:10px var(--mono);color:var(--amber);margin-top:auto}.tag{font:9px var(--mono);border:1px solid #35575b;color:var(--cyan);padding:4px 7px;align-self:flex-start}
.dossier-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0}.dossier-title h2{font:700 clamp(36px,6vw,60px)/.9 var(--head);margin:8px 0}.dossier-title p{font:12px var(--mono);color:var(--amber)}

.photo-frame{background:#050b0e;border:1px solid #34545a;min-height:220px;position:relative;display:grid;place-items:center;overflow:hidden}.photo-frame img{display:block;width:100%;max-height:390px;object-fit:contain}.photo-caption{font:10px/1.6 var(--mono);color:var(--muted);padding:9px 0}.photo-caption a{color:var(--cyan)}.photo-status{font:11px var(--mono);color:var(--muted);padding:20px;text-align:center}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}.fact{border:1px solid #203b41;padding:10px}.fact b{display:block;font:10px var(--mono);color:var(--muted);margin-bottom:5px}.fact span{font-size:12px;color:var(--white)}
.timeline{border-left:1px solid #37646a;margin:15px 0 0 5px;padding-left:17px}.event{position:relative;margin:0 0 16px}.event:before{content:"";position:absolute;left:-22px;top:4px;width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 9px #9cffb0}.event b{font:11px var(--mono);color:var(--amber)}.event p{font-size:12px;line-height:1.55;color:#b4c4bf;margin:4px 0}
.learning{border:1px solid #456052;background:#9cffb008;padding:16px;margin-top:18px}.learning h4{margin:0 0 8px;color:var(--green)}.learning p{font-size:13px;line-height:1.7;color:#c3d2ca;margin:0}
.quiz{margin-top:18px;border:1px solid #426067;background:#0b1b20;padding:18px}.quiz .q-label{font:10px var(--mono);color:var(--amber);letter-spacing:.15em}.quiz h3{margin:8px 0 14px}.answers{display:grid;gap:8px}.answer{background:#10252b;border:1px solid #29464d;color:#d7e4de;text-align:left;padding:11px 13px;font-size:12px;line-height:1.45}.answer:hover{border-color:var(--cyan)}.answer.correct{border-color:var(--green);background:#9cffb014}.answer.wrong{border-color:var(--red);background:#ff666e12}.feedback{font-size:12px;line-height:1.6;margin-top:12px;padding:10px;border-left:2px solid var(--cyan);color:#c5d4cf}.quiz-next{margin-top:13px}
.mapbox{border:1px solid var(--line);background:#071216;padding:14px;margin-top:16px}.mapbox svg{width:100%;height:auto;display:block}.map-note{font:10px/1.5 var(--mono);color:var(--muted);margin-top:8px}
.final-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.final-q{padding:15px;border:1px solid var(--line);background:#0d1e23}.final-q p{font-size:13px;line-height:1.5}.final-q select{width:100%;background:#071216;color:var(--white);border:1px solid #34545a;padding:10px;font:12px var(--body)}
.footer{border-top:1px solid var(--line);margin-top:50px;padding:18px 0;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:var(--muted);font:10px var(--mono)}
.toast{position:fixed;bottom:20px;right:20px;background:#102a2d;border:1px solid var(--green);color:var(--green);padding:12px 16px;font:11px var(--mono);z-index:30;box-shadow:0 8px 30px #0008}
@media(max-width:800px){#app{padding:14px 16px 40px}.grid{grid-template-columns:1fr}.dossier-layout{grid-template-columns:1fr}.section-head{display:block}.file-card{grid-template-columns:130px 1fr}.thumb{min-height:170px}.hero{min-height:70vh}.statusline{font-size:9px}.final-grid{grid-template-columns:1fr}}
@media(max-width:430px){.file-card{grid-template-columns:105px 1fr;min-height:165px}.thumb{min-height:165px}.card-copy{padding:13px}.card-copy h3{font-size:21px}.panel{padding:15px}.topbar{align-items:flex-start}.brand{font-size:19px}}

<script>
"use strict";
/* ============================================================
   THE LAST SIGNAL
   Para modificar: editar los objetos de MISSIONS (historias,

const MISSIONS = [
{
 id:"eagle", number:"001", name:"EAGLE", subtitle:"Apollo 11 · Etapa de descenso", year:"1969", place:"Mar de la Tranquilidad · Luna",
 location:"Luna", status:"REGISTRO PARCIAL", icon:"◒",
 teaser:"Una estructura inmóvil. El lugar donde comenzó una nueva página de la historia humana.",
 query:"Apollo 11 lunar module descent stage Eagle Moon",
 imageTerms:["Apollo 11","Eagle","Lunar Module","descent stage"],
 alt:"Fotografía NASA del lugar de alunizaje de Apollo 11 o de la etapa de descenso del módulo lunar Eagle.",
 what:"Soy la etapa de descenso del módulo lunar Eagle, la parte inferior de una nave diseñada para llevar astronautas desde la órbita lunar hasta la superficie. No era una nave completa por sí sola: formaba parte de un sistema de dos etapas.",
 built:"Fui construida por Grumman Aircraft Engineering Corporation para el programa Apollo de la NASA. Mi diseño tenía que funcionar en un entorno sin aire, con gravedad mucho menor que la terrestre y con polvo lunar.",
 journey:"El 16 de julio de 1969 despegué de Florida dentro del cohete Saturn V, junto con el resto de Apollo 11. Después del viaje a la Luna, el módulo lunar se separó del módulo de mando en órbita. El 20 de julio, Eagle descendió y alunizó en el Mar de la Tranquilidad.",
 function:"Mi etapa inferior contenía las patas de aterrizaje, el motor de descenso y equipos que permitían controlar el alunizaje. La etapa superior, donde viajaban Neil Armstrong y Buzz Aldrin, volvió a despegar desde la Luna para reunirse con Michael Collins en órbita.",
 work:"El 20 de julio de 1969 ayudé a llevar a los primeros seres humanos que caminaron sobre la Luna. Tras el trabajo en la superficie, mi etapa superior despegó. Yo permanecí allí: ya había cumplido mi función.",
 discoveries:"Apollo 11 permitió estudiar muestras de suelo y rocas lunares, desplegar instrumentos científicos y demostrar que era posible realizar un alunizaje tripulado y regresar a la Tierra. Las muestras ayudaron a investigar la historia geológica de la Luna.",
 why:"La etapa de descenso quedó en la superficie lunar cuando la etapa de ascenso partió. No fue un abandono accidental: era parte del diseño de la misión. La masa que quedaba en la Luna no necesitaba regresar.",
 importance:"Represento un paso decisivo de la exploración espacial: tecnología, navegación, trabajo científico y cooperación humana reunidos en una misión que amplió lo que sabíamos sobre nuestro lugar en el sistema solar.",
 last:"No tengo una última transmisión propia documentada. Mi historia no terminó con una despedida: la etapa de ascenso se separó y regresó a la órbita lunar. La etapa inferior permaneció en el lugar de alunizaje. Décadas después, la Lunar Reconnaissance Orbiter fotografió el sitio y permitió reconocer rastros de la misión.",
 timeline:[["16 JUL 1969","Lanzamiento de Apollo 11 desde el Centro Espacial Kennedy."],["19 JUL 1969","Apollo 11 entró en órbita lunar."],["20 JUL 1969","Eagle alunizó en el Mar de la Tranquilidad."],["21 JUL 1969","La etapa de ascenso despegó de la Luna y se reunió con Columbia."],["24 JUL 1969","La tripulación regresó a la Tierra. La etapa de descenso quedó en la Luna."]],
 learn:"El módulo lunar estaba formado por una etapa de descenso y otra de ascenso. La primera aterrizó y permaneció en la Luna; la segunda llevó a los astronautas de vuelta a la órbita lunar. La misión también trajo a la Tierra 21,6 kg de muestras lunares.",
 activity:{question:"¿Qué parte del módulo lunar Eagle permaneció en la superficie de la Luna?",options:["La etapa de ascenso","La etapa de descenso","El módulo de mando"],correct:1,explain:"La etapa de descenso tenía las patas y el motor que permitieron alunizar. La etapa de ascenso despegó con Armstrong y Aldrin para reunirse con el módulo de mando."},
 map:"Mar de la Tranquilidad, cerca del ecuador lunar. Coordenadas aproximadas del sitio Apollo 11: 0.674° N, 23.473° E.",
 source:"https://science.nasa.gov/earth/earth-observatory/apollo-11-landing-site-39408/",
 source2:"https://www.nasa.gov/missions/apollo/apollo-11-mission-overview/"
},
{
 id:"lrv",number:"002",name:"LUNAR ROVING VEHICLE",subtitle:"Apollo 15, 16 y 17 · Vehículo lunar",year:"1971–1972",place:"Lugares de alunizaje Apollo 15, 16 y 17 · Luna",
 location:"Luna",status:"REGISTRO RECUPERADO",icon:"⌁",
 teaser:"Cuatro ruedas, baterías y una misión: ampliar el territorio que los astronautas podían explorar.",
 query:"Apollo lunar roving vehicle LRV NASA Moon",
 imageTerms:["Lunar Roving Vehicle","Apollo 15","LRV"],
 alt:"Fotografía NASA de un Lunar Roving Vehicle utilizado durante las misiones Apollo.",
 what:"Soy el Lunar Roving Vehicle, conocido como LRV: un vehículo eléctrico abierto, plegable y de cuatro ruedas. Fui diseñado para transportar astronautas, herramientas y muestras por la superficie lunar.",
 built:"Fui desarrollado por Boeing, con importantes contribuciones de General Motors, para la NASA. Mi estructura debía plegarse para viajar dentro del módulo lunar y desplegarse después del alunizaje.",
 journey:"Viajé hasta la Luna plegado en el módulo lunar. Una vez que los astronautas llegaron a la superficie, me desplegaron y prepararon para circular. Tres vehículos fueron utilizados en Apollo 15, Apollo 16 y Apollo 17, entre 1971 y 1972.",
 function:"Funcionaba con motores eléctricos en las ruedas y baterías no recargables. Tenía dirección en las ruedas delanteras y traseras, asientos para dos astronautas, cámaras y espacio para transportar herramientas y muestras.",
 work:"Permití que las tripulaciones recorrieran distancias mucho mayores que a pie. Los astronautas podían visitar distintos puntos geológicos, detenerse para tomar fotografías, recoger muestras y realizar observaciones.",
 discoveries:"El rover amplió el alcance de la exploración geológica. En Apollo 15, por ejemplo, los astronautas pudieron estudiar el área de Hadley-Apennine y recoger muestras en distintos puntos. El vehículo no descubría por sí solo: ayudaba a los equipos científicos a llegar a más lugares.",
 why:"Los LRV fueron diseñados para las misiones lunares y no para regresar a la Tierra. Cada uno quedó en la Luna cuando su tripulación despegó en la etapa de ascenso del módulo lunar.",
 importance:"El rover cambió la escala de la exploración humana en la Luna. Demostró que un vehículo relativamente pequeño podía convertir una caminata limitada en una expedición científica más extensa.",
 last:"No existe una transmisión final emitida por el rover como si fuera una sonda autónoma. Su actividad dependía de los astronautas y de los sistemas de la misión. Al terminar cada expedición, el vehículo quedó estacionado cerca del sitio de trabajo y la tripulación regresó al módulo lunar.",
 timeline:[["26 JUL 1971","Apollo 15 despegó; el primer LRV viajó a la Luna."],["30 JUL 1971","Apollo 15 alunizó y desplegó el primer rover lunar."],["20 ABR 1972","Apollo 16 utilizó el segundo LRV en la región de Descartes."],["11 DIC 1972","Apollo 17 desplegó el tercer y último LRV de Apollo."],["DIC 1972","El programa Apollo terminó sus misiones lunares tripuladas. Los tres LRV quedaron en la Luna."]],
 learn:"Los LRV eran vehículos eléctricos de batería, no automóviles con motor de combustión. Su baja gravedad, el terreno irregular y la necesidad de plegarlos dentro del módulo lunar exigieron un diseño muy particular.",
 activity:{question:"¿Por qué los astronautas necesitaban el Lunar Roving Vehicle?",options:["Para volar entre la Tierra y la Luna","Para explorar mayores distancias y transportar muestras","Para producir oxígeno en la superficie"],correct:1,explain:"El rover permitía recorrer zonas más alejadas del módulo lunar, transportar herramientas y traer muestras. No era una nave ni un sistema de soporte vital."},
 map:"Los LRV se utilizaron en tres regiones: Hadley-Apennine (Apollo 15), Descartes (Apollo 16) y el valle Taurus-Littrow (Apollo 17).",
 source:"https://www.nasa.gov/history/50-years-ago-apollo-15-on-the-moon/",
 source2:"https://www.nasa.gov/missions/apollo/apollo-17-mission-overview/"
},
{
 id:"pathfinder",number:"003",name:"PATHFINDER / SOJOURNER",subtitle:"Mars Pathfinder · Lander y rover",year:"1997",place:"Ares Vallis · Marte",
 location:"Marte",status:"REGISTRO RECUPERADO",icon:"⌖",
 teaser:"Un pequeño explorador. Un aterrizaje que abrió un camino para los rovers que vendrían después.",
 query:"NASA Mars Pathfinder Sojourner rover airbags on Mars",
 imageTerms:["Mars Pathfinder","Sojourner","Ares Vallis"],
 alt:"Fotografía NASA del rover Sojourner y el módulo Pathfinder sobre la superficie marciana.",
 what:"Somos dos piezas de una misma misión. Pathfinder fue una plataforma de aterrizaje; Sojourner fue un pequeño rover de seis ruedas que descendió desde ella para explorar el terreno.",
 built:"La NASA desarrolló la misión a través del Jet Propulsion Laboratory. Pathfinder fue diseñada como una demostración tecnológica de bajo costo para probar una forma nueva de llevar instrumentos y un rover hasta Marte.",
 journey:"Despegamos el 4 de diciembre de 1996 en un cohete Delta II. Tras viajar por el espacio interplanetario, llegamos a Marte el 4 de julio de 1997. Entramos en la atmósfera dentro de una cápsula protectora, usamos un paracaídas y un sistema de airbags para amortiguar el impacto.",
 function:"Pathfinder estudió el entorno y sirvió de base para Sojourner. El rover llevaba cámaras y un espectrómetro APXS para analizar la composición elemental de rocas y suelo. Los airbags se inflaron alrededor del módulo para amortiguar el aterrizaje.",
 work:"Después de rebotar sobre la superficie, Pathfinder quedó en Ares Vallis. Sojourner descendió por una rampa y comenzó a moverse entre las rocas. Tomó fotografías y realizó mediciones científicas.",
 discoveries:"La misión devolvió miles de imágenes y datos sobre rocas, suelo y clima. Las mediciones ayudaron a estudiar la composición de materiales marcianos y aportaron evidencia sobre el pasado geológico y posiblemente más húmedo de Marte.",
 why:"Pathfinder y Sojourner dejaron de operar después de que se perdió la comunicación. No fueron recuperados: estaban en Marte y no tenían un vehículo que pudiera traerlos de vuelta.",
 importance:"Pathfinder demostró que era posible aterrizar con airbags y desplegar un rover en Marte. Sus técnicas influyeron en el diseño de misiones posteriores y acercaron la exploración robótica al público.",
 last:"La última transmisión de datos recibida de Pathfinder fue el 27 de septiembre de 1997. Los equipos intentaron recuperar las comunicaciones durante meses. La misión fue declarada terminada el 10 de marzo de 1998. Sojourner había trabajado 83 días marcianos terrestres? No: 83 días terrestres, frente a una misión primaria prevista de siete días.",
 timeline:[["04 DIC 1996","Lanzamiento desde Cabo Cañaveral, Florida."],["04 JUL 1997","Pathfinder aterrizó en Ares Vallis, Marte."],["05 JUL 1997","Sojourner comenzó a desplazarse sobre la superficie."],["27 SEP 1997","Se recibió la última transmisión de datos."],["10 MAR 1998","La misión fue oficialmente terminada tras los intentos de recuperar el contacto."]],
 learn:"Pathfinder fue la primera nave en utilizar airbags para amortiguar un aterrizaje en Marte. El paracaídas redujo la velocidad durante el descenso y los airbags protegieron al conjunto durante los impactos. Sojourner superó ampliamente su misión primaria de siete días y operó 83 días.",
 activity:{question:"¿Qué función cumplían los airbags de Mars Pathfinder?",options:["Mantener al rover flotando sobre Marte","Amortiguar los impactos al tocar la superficie","Impulsar a Sojourner durante sus recorridos"],correct:1,explain:"Los airbags se inflaron alrededor de la nave antes del contacto con el suelo. El conjunto rebotó varias veces y se detuvo. Después, los airbags se desinflaron y Sojourner pudo salir por una rampa."},
 map:"Ares Vallis, una antigua región de canales de desbordamiento en Marte. Pathfinder aterrizó en el hemisferio norte marciano.",
 source:"https://science.nasa.gov/mission/mars-pathfinder/",
 source2:"https://science.nasa.gov/resource/pathfinders-rover-airbags-martian-terrain/"
},

const main=document.getElementById("main");
let completed=new Set(JSON.parse(localStorage.getItem("tls-completed")||"[]"));
let activeMission=null, soundOn=false, audioCtx=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("tls-completed",JSON.stringify([...completed]));updateStatus()}
function updateStatus(){document.getElementById("progressText").textContent=`ARCHIVOS: ${String(completed.size).padStart(2,"0")} / 05`}
function goTop(){window.scrollTo({top:0,behavior:"smooth"})}
function showIntro(){main.innerHTML=`<section class="screen hero"><div class="hero-inner"><div class="bootlog">SYSTEM REBOOTING...<br>SIGNAL DETECTED.<br>ORIGIN: UNKNOWN.<br><span class="warn">HUMAN COMMUNICATION: OFFLINE.</span><br>ARCHIVES RECOVERED: 05.</div><h1>THE LAST<br>SIGNAL</h1><p class="subtitle">“We are still here.”</p><p class="intro">La humanidad dejó de responder. Pero en la Luna y Marte todavía quedan máquinas que recuerdan. Una transmisión desconocida acaba de llegar. Recuperá los archivos y reconstruí la historia de cada misión.</p><button class="primary" id="startBtn">[ INICIAR TRANSMISIÓN ]</button><div class="micro">INCOMING DATA // 5 EXPEDIENTES // HISTORIA REAL + NARRATIVA FICTICIA</div></div></section>`;document.getElementById("startBtn").onclick=showArchive}
function showArchive(){activeMission=null;main.innerHTML=`<section class="screen"><div class="section-head"><div><div class="eyebrow">INVENTARIO DE SEÑALES // SECTOR LUNA-MARTE</div><h2>ARCHIVO DE ARTEFACTOS</h2></div><p>Cinco registros sobrevivieron al silencio. Abrí cada expediente, recuperá su historia y completá la actividad para desbloquear el desafío final.</p></div><div class="eyebrow">PROGRESO DE RECUPERACIÓN · ${completed.size}/5</div><div class="progress-wrap"><div class="progress-fill" style="width:${completed.size*20}%"></div></div><div class="grid">${MISSIONS.map((m,i)=>`<button class="file-card" data-id="${m.id}"><div class="thumb"><div class="placeholder">${m.icon}</div><img data-mission="${m.id}" alt="${esc(m.alt)}" class="hidden"></div><div class="card-copy"><span class="file-no">ARCHIVO ${m.number} ${completed.has(m.id)?"· RECUPERADO":"· EN ESPERA"}</span><h3>${esc(m.name)}</h3><p>${esc(m.teaser)}</p><span class="card-meta">${esc(m.year)} // ${esc(m.place)}</span><span class="tag">${completed.has(m.id)?"DATOS RECUPERADOS":"ABRIR EXPEDIENTE"}</span></div></button>`).join("")}</div><div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap"><button class="secondary" id="finalBtn" ${completed.size<5?"disabled style='opacity:.4;cursor:not-allowed'":""}>DESAFÍO FINAL ${completed.size<5?"· BLOQUEADO":"· DISPONIBLE"}</button><span class="micro">Los expedientes se pueden volver a consultar. El desafío se habilita al completar las cinco actividades.</span></div></section>`;
main.querySelectorAll(".file-card").forEach(b=>b.onclick=()=>showDossier(b.dataset.id));
document.getElementById("finalBtn").onclick=()=>{if(completed.size===5)showFinal()};
MISSIONS.forEach(loadMissionImage)}
async function loadMissionImage(m){const nodes=[...document.querySelectorAll(`img[data-mission="${m.id}"]`)];if(!nodes.length)return;try{const q=encodeURIComponent(m.query);const res=await fetch(`https://images-api.nasa.gov/search?q=${q}&media_type=image&page_size=30`);if(!res.ok)throw Error("NASA API");const data=await res.json();const items=data.collection?.items||[];let item=items.find(it=>{const s=((it.data?.[0]?.title||"")+" "+(it.data?.[0]?.description||"")).toLowerCase();return m.imageTerms.some(t=>s.includes(t.toLowerCase()))})||items[0];if(!item)return;const meta=item.data?.[0]||{};const link=item.links?.find(l=>l.rel==="preview");if(!link?.href)return;nodes.forEach(img=>{img.src=link.href;img.classList.remove("hidden");img.onload=()=>{const p=img.parentElement.querySelector(".placeholder");if(p)p.classList.add("hidden")};img.onerror=()=>img.classList.add("hidden")});m.photoCredit=meta.photographer||meta.center||"NASA";m.photoTitle=meta.title||"Imagen de archivo NASA";m.photoLink=meta.nasa_id?`https://images.nasa.gov/details/${encodeURIComponent(meta.nasa_id)}`:"https://images.nasa.gov/"}catch(e){/* Si no hay conexión, el expediente y su fuente oficial siguen disponibles. */}}
function showDossier(id){const m=MISSIONS.find(x=>x.id===id);if(!m)return;activeMission=m;const photo=m.photoLink?`<img src="${esc(document.querySelector(`img[data-mission="${m.id}"]`)?.src||"")}" alt="${esc(m.alt)}">`:`<div class="photo-status">IMAGEN NASA NO DISPONIBLE EN ESTA CONEXIÓN.<br>CONSULTÁ EL REGISTRO OFICIAL EN EL ENLACE DE FUENTE.</div>`;
main.innerHTML=`<section class="screen"><div class="dossier-head"><div class="dossier-title"><div class="eyebrow">ARCHIVO ${m.number} // ${m.status}</div><h2>${esc(m.name)}</h2><p>${esc(m.subtitle)} · ${esc(m.year)}</p></div><button class="back-btn" id="backBtn">← VOLVER AL ARCHIVO</button></div><div class="dossier-layout"><div><div class="panel"><div class="eyebrow">REGISTRO VISUAL // NASA ARCHIVE</div><div class="photo-frame">${photo}</div><div class="photo-caption">${esc(m.photoTitle||"Búsqueda en NASA Image and Video Library")} · Crédito: ${esc(m.photoCredit||"NASA/JPL")} · <a href="${esc(m.photoLink||"https://images.nasa.gov/search?q="+encodeURIComponent(m.query))}" target="_blank" rel="noopener">VER REGISTRO ORIGINAL ↗</a><br><span class="muted">La imagen se obtiene de la biblioteca oficial de NASA cuando hay conexión. Su título y crédito se muestran desde los metadatos del archivo.</span></div><div class="facts"><div class="fact"><b>AÑO</b><span>${esc(m.year)}</span></div><div class="fact"><b>UBICACIÓN</b><span>${esc(m.location)}</span></div><div class="fact"><b>SITIO</b><span>${esc(m.place)}</span></div><div class="fact"><b>ESTADO DEL REGISTRO</b><span>${esc(m.status)}</span></div></div><h3>MEMORIA RECUPERADA</h3><div class="fiction-note"><b>NOTA DE ARCHIVO:</b> La narración en primera persona es un recurso literario. Los artefactos no poseen conciencia ni emitieron estos relatos. Los datos de la misión son históricos y se identifican por separado.</div><div class="story"><h4>01 // ¿QUÉ SOY?</h4><p>${esc(m.what)}</p><h4>02 // ¿QUIÉN ME CONSTRUYÓ?</h4><p>${esc(m.built)}</p><h4>03 // EL VIAJE</h4><p>${esc(m.journey)}</p><h4>04 // MI FUNCIÓN</h4><p>${esc(m.function)}</p><h4>05 // LO QUE HICE</h4><p>${esc(m.work)}</p><h4>06 // LO QUE AYUDÉ A DESCUBRIR</h4><p>${esc(m.discoveries)}</p><h4>07 // ¿POR QUÉ ME QUEDÉ?</h4><p>${esc(m.why)}</p><h4>08 // POR QUÉ IMPORTO</h4><p>${esc(m.importance)}</p></div><div class="learning"><h4>LO QUE LA TIERRA APRENDIÓ DE MÍ</h4><p>${esc(m.learn)}</p></div><h4>ÚLTIMO REGISTRO</h4><div class="story"><p>${esc(m.last)}</p></div><h4>CRONOLOGÍA DE MISIÓN</h4><div class="timeline">${m.timeline.map(t=>`<div class="event"><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div>`).join("")}</div></div></div><aside><div class="panel"><div class="eyebrow">CARTOGRAFÍA // UBICACIÓN</div><h3>¿DÓNDE QUEDÉ?</h3><div class="mapbox">${mapSvg(m.location)}<p class="map-note">${esc(m.map)}<br>ESQUEMA EXPLICATIVO ORIGINAL · NO ES UNA FOTOGRAFÍA NI UN MAPA A ESCALA.</p></div><h4>FUENTES OFICIALES</h4><p class="story" style="font-size:12px">La información histórica de este expediente se basa en documentación de NASA y JPL. Consultá las páginas de la misión y sus archivos visuales.</p><p><a href="${esc(m.source)}" target="_blank" rel="noopener">NASA · FUENTE PRINCIPAL ↗</a></p><p><a href="${esc(m.source2)}" target="_blank" rel="noopener">NASA / JPL · FUENTE COMPLEMENTARIA ↗</a></p><p><a href="https://images.nasa.gov/" target="_blank" rel="noopener">NASA IMAGE AND VIDEO LIBRARY ↗</a></p></div><div class="quiz" id="quiz"><div class="q-label">PRUEBA DE RECUPERACIÓN // ${m.number}</div><h3>${esc(m.activity.question)}</h3><div class="answers">${m.activity.options.map((o,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="feedback" aria-live="polite"></div><button class="primary quiz-next hidden" id="continueBtn">CONTINUAR AL ARCHIVO →</button></div></aside></div></section>`;
document.getElementById("backBtn").onclick=showArchive;main.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answerQuestion(m,Number(b.dataset.answer)));goTop()}
function mapSvg(location){const moon=location==="Luna";return `<svg viewBox="0 0 420 190" role="img" aria-label="Esquema ilustrativo de la ubicación en ${moon?"la Luna":"Marte"}"><defs><radialGradient id="planet"><stop offset="0" stop-color="${moon?"#a9a79b":"#c66d4c"}"/><stop offset="1" stop-color="${moon?"#343b3b":"#512b2b"}"/></radialGradient></defs><rect width="420" height="190" fill="#071216"/><g opacity=".35" fill="#9cffb0"><circle cx="34" cy="28" r="1"/><circle cx="90" cy="55" r="1"/><circle cx="370" cy="34" r="1"/><circle cx="330" cy="120" r="1"/><circle cx="58" cy="152" r="1"/></g><circle cx="210" cy="110" r="77" fill="url(#planet)" stroke="#66817b" stroke-width="1"/><path d="M145 89 Q178 60 204 88 T270 77 M149 133 Q194 112 229 141 T278 128" stroke="#101b1d" stroke-width="5" opacity=".5" fill="none"/><path d="M210 34V186 M133 110H287" stroke="#d5e5cf" stroke-dasharray="3 5" opacity=".25"/><circle cx="210" cy="110" r="4" fill="#9cffb0"/><circle cx="210" cy="110" r="13" fill="none" stroke="#9cffb0" opacity=".5"/><text x="210" y="18" fill="#9cffb0" text-anchor="middle" font-size="10" font-family="monospace">${moon?"LUNA":"MARTE"} // SUPERFICIE</text><text x="210" y="174" fill="#e8f2ed" text-anchor="middle" font-size="9" font-family="monospace">UBICACIÓN DE MISIÓN · ESQUEMA</text></svg>`}
function answerQuestion(m,n){const buttons=[...main.querySelectorAll(".answer")];if(buttons.some(b=>b.disabled))return;buttons.forEach(b=>{b.disabled=true;const v=Number(b.dataset.answer);if(v===m.activity.correct)b.classList.add("correct");else if(v===n)b.classList.add("wrong")});const ok=n===m.activity.correct;document.getElementById("feedback").innerHTML=`<div class="feedback"><b style="color:${ok?"var(--green)":"var(--red)"}">${ok?"SEÑAL RECUPERADA.":"RESPUESTA INCORRECTA."}</b><br>${esc(m.activity.explain)}</div>`;if(ok){completed.add(m.id);save();}document.getElementById("continueBtn").classList.remove("hidden");document.getElementById("continueBtn").onclick=showArchive}
function showFinal(){main.innerHTML=`<section class="screen"><div class="section-head"><div><div class="eyebrow">PROTOCOLO FINAL // CINCO ARCHIVOS SINCRONIZADOS</div><h2>LA SEÑAL COMPLETA</h2></div><p>Los registros ya están recuperados. Ahora conectá cada tecnología con la función que cumplió en la exploración espacial.</p></div><div class="panel"><div class="eyebrow">DESAFÍO FINAL · 5 RESPUESTAS</div><div class="final-grid">${[{q:"¿Qué etapa del Eagle permaneció en la Luna?",a:["Etapa de ascenso","Etapa de descenso","Módulo de mando"],c:1},{q:"¿Qué permitió el LRV?",a:["Explorar mayores distancias","Aterrizar en Marte","Transmitir imágenes desde órbita"],c:0},{q:"¿Qué protegió a Pathfinder durante el impacto?",a:["Un escudo magnético","Airbags","Un cable de descenso"],c:1},{q:"¿Cuál era la duración prevista de la misión primaria de Spirit?",a:["90 soles","90 años","9 soles"],c:0},{q:"¿Qué hacía el paracaídas de Mars 2020?",a:["Reducía la velocidad durante el descenso","Elevaba el rover desde el suelo","Lo mantenía en órbita"],c:0}].map((x,i)=>`<div class="final-q"><div class="eyebrow">PREGUNTA 0${i+1}</div><p>${x.q}</p><select data-final="${i}"><option value="">Seleccionar respuesta...</option>${x.a.map((a,j)=>`<option value="${j}">${a}</option>`).join("")}</select><span class="muted" id="finalNote${i}" style="font-size:10px"></span></div>`).join("")}</div><div style="margin-top:20px"><button class="primary" id="checkFinal">VERIFICAR TRANSMISIÓN</button></div><div id="finalResult" aria-live="polite"></div></div><div style="margin-top:20px"><button class="back-btn" id="finalBack">← VOLVER AL ARCHIVO</button></div></section>`;document.getElementById("finalBack").onclick=showArchive;document.getElementById("checkFinal").onclick=()=>{const correct=[1,0,1,0,0];let score=0;correct.forEach((v,i)=>{const s=document.querySelector(`[data-final="${i}"]`);const ok=Number(s.value)===v&&s.value!=="";if(ok)score++;document.getElementById("finalNote"+i).textContent=ok?"✓ Correcto":"Revisá este dato en los expedientes";document.getElementById("finalNote"+i).style.color=ok?"var(--green)":"var(--amber)"});document.getElementById("finalResult").innerHTML=`<div class="learning" style="margin-top:18px"><h4>${score===5?"TRANSMISIÓN RESTAURADA.":"SEÑAL PARCIAL: "+score+"/5"}</h4><p>${score===5?"Los cinco archivos están conectados. Las máquinas no enviaron una despedida: dejaron datos, imágenes y pruebas de lo que la humanidad fue capaz de explorar. La historia continúa en cada pregunta que hacemos.":"Todavía quedan datos por recuperar. Volvé a los expedientes, revisá sus cronologías y probá otra vez."}</p></div>`}}
function tick(){const d=new Date();document.getElementById("clock").textContent="UTC "+d.toISOString().slice(11,19)}
document.getElementById("resetBtn").onclick=()=>{if(confirm("¿Reiniciar todo el progreso de THE LAST SIGNAL?")){completed.clear();save();showIntro()}};
document.getElementById("soundBtn").onclick=()=>{soundOn=!soundOn;const b=document.getElementById("soundBtn");b.textContent=`◖ SONIDO: ${soundOn?"ON":"OFF"}`;b.setAttribute("aria-pressed",String(soundOn));if(soundOn)beep(440,.09)};
function beep(freq,duration){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
tick();setInterval(tick,1000);updateStatus();showIntro();
</script>
